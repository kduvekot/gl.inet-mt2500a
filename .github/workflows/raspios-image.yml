name: Raspberry Pi OS image

# Repackages the latest official Raspberry Pi OS Lite (64-bit) as a .zip
# that the Chromebook Recovery Utility can write to an SD card ("Use local
# image"). The utility lists .img.xz files but does not actually write them.
#
# The image is taken unmodified from the official Raspberry Pi image list
# (the one Raspberry Pi Imager uses), checked against both published
# SHA256 sums, and published as the "raspios-lite-arm64" release, so the
# .zip downloads directly (a workflow artifact would wrap it in a second
# zip). Configure it after writing; see docs/raspberry-pi-sd-chromebook.md.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the release already has this image
        type: boolean
        default: false

permissions:
  contents: read

env:
  OS_LIST_URL: https://downloads.raspberrypi.com/os_list_imagingutility_v4.json
  RELEASE_TAG: raspios-lite-arm64

jobs:
  repackage:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Find the latest Raspberry Pi OS Lite (64-bit)
        id: find
        run: |
          curl -fsSL -o os_list.json "$OS_LIST_URL"
          jq -r '[.. | objects
                  | select(has("url") and (.url | test("/raspios_lite_arm64/"))
                           and ((.devices // []) | index("pi3-64bit")))]
                 | first
                 | "name=\(.name)\ndate=\(.release_date)\nurl=\(.url)\nimg_sha256=\(.extract_sha256)\nimg_size=\(.extract_size)"' \
            os_list.json | tee -a "$GITHUB_OUTPUT"
          grep -q '^url=https://downloads.raspberrypi.com/' "$GITHUB_OUTPUT"

      - name: Check whether the release already has this image
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.find.outputs.url }}
          FORCE: ${{ inputs.force }}
        run: |
          zip_name="$(basename "$URL" .img.xz).zip"
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name' 2> /dev/null || true)
          if grep -qxF "$zip_name" <<< "$assets"; then
            if [ "$FORCE" = true ]; then
              echo "Release already has $zip_name; rebuilding because 'force' is set." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=Already up to date::$zip_name is already published: $release_url"
              {
                echo "### Already up to date"
                echo "[\`$RELEASE_TAG\`]($release_url) already has \`$zip_name\`, the latest image. Nothing to do."
                echo
                echo "Run again with **force** to rebuild it anyway."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "New image: $zip_name" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify
        if: steps.check.outputs.skip != 'true'
        env:
          URL: ${{ steps.find.outputs.url }}
          IMG_SHA256: ${{ steps.find.outputs.img_sha256 }}
        run: |
          xz_name=$(basename "$URL")
          img_name=${xz_name%.xz}
          curl -fsSL -o "$xz_name" "$URL"
          curl -fsSL -o "$xz_name.sha256" "$URL.sha256"
          sha256sum -c "$xz_name.sha256"
          xz -d -T0 "$xz_name"
          echo "${IMG_SHA256}  ${img_name}" | sha256sum -c -
          echo "IMG_NAME=$img_name" >> "$GITHUB_ENV"

      - name: Repackage as zip
        if: steps.check.outputs.skip != 'true'
        run: |
          zip_name="${IMG_NAME%.img}.zip"
          size=$(stat -c %s "$IMG_NAME")
          # Above 4 GiB, zip needs Zip64, which the Recovery Utility may not read.
          [ "$size" -lt 4294967296 ] || { echo "Image is >= 4 GiB; Zip64 would be needed"; exit 1; }
          zip -6 -j "$zip_name" "$IMG_NAME"
          unzip -t "$zip_name"
          sha256sum "$zip_name" "$IMG_NAME" > SHA256SUMS
          cat SHA256SUMS
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - name: Remove the previous release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Publish release
        id: publish
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Raspberry Pi OS Lite (64-bit) for Chromebook Recovery Utility
          prerelease: true
          make_latest: false
          files: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS
          body: |
            ${{ steps.find.outputs.name }}, released ${{ steps.find.outputs.date }}, unmodified.

            * Source: ${{ steps.find.outputs.url }}
            * Image SHA256 (from the official image list): `${{ steps.find.outputs.img_sha256 }}`

            Write `${{ env.ZIP_NAME }}` with the Chromebook Recovery Utility (gear icon → Use local image).
            Then set up user, SSH and WiFi on the boot partition: see `docs/raspberry-pi-sd-chromebook.md`.

      - name: Link the release
        if: steps.check.outputs.skip != 'true'
        env:
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          echo "::notice title=Published::$ZIP_NAME: $RELEASE_URL"
          {
            echo "### Published"
            echo "[\`$ZIP_NAME\`]($RELEASE_URL) is ready for the Chromebook Recovery Utility."
          } >> "$GITHUB_STEP_SUMMARY"
