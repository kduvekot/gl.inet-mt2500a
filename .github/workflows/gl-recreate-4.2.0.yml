name: GL.iNet release recreation (MT2500)

# Rebuild a GL.iNet MT2500 firmware release (input "release", a row of
# openwrt/gl-releases.tsv; 4.2.0 is validated) as far as public sources
# allow, then compare it with GL.iNet's official image of that release.
#
# Recipe (GL.iNet's own build system, from the fork that survived its
# removal: https://github.com/spmadden/gl-infra-builder, tag
# v4.2.0_mt2500_release4 for 4.2.0):
#   * OpenWrt openwrt-21.02 at bcaabe6d (r16649), set by
#     configs/config-mt798x-7.6.6.1.yml
#   * patches-mt798x-7.6.6.1/*.patch applied with "git am -3" by setup.py
#   * profiles target_mt7981_gl-mt2500 + glinet_mt2500, via gen_config.py
#   * then every public package that the official image contains is
#     selected too, and anything it doesn't contain is deselected, so the
#     package set mirrors GL.iNet's
#   * CONFIG_ALL_KMODS=y: GL.iNet's kernel configuration (read from the
#     official kernel, CONFIG_IKCONFIG=y) has every kernel module package
#     built as a module, plus the built-in options those packages set
#     (run 2 comparison: 739 options m only there, the rest mostly options
#     set =y by package/kernel/linux/modules/*.mk or their defaults)
#
# What's not public, and therefore left out (listed in the report):
#   * GL.iNet's private GitLab feeds (gl-sdk4-collect, mt7981-feeds): the
#     web UI and apps (gl-sdk4-*, oui-*), fwdd, kmod-mtfwd, kmod-mtqos,
#     mtk-base-files, kmod-gl-sdk4-tertf, kmod-gl-sdk4-hw-info
#   * git01.mediatek.com now needs a login; the same commit (df3fc79) is
#     taken from GL.iNet's GitHub mirror instead.
#
# Cache: downloads (dl/) (and ccache, now off) are restored before and saved after
# every run, also failed ones, so iterations only recompile what changed.
# ccache needs CONFIG_DEVEL=y in OpenWrt 21.02 (config/Config-devel.in:
# 'bool "Use ccache" if DEVEL').
#
# The official image is downloaded from GL.iNet (SHA256-checked) and used
# only inside the run (package list, comparison); it is never stored as an
# artifact.
#
# With "closed", GL.iNet's closed packages and image-level files are added,
# generated inside the run from the official image
# (.github/scripts/gen-closed-feed.py, openwrt/gl-4.2.0-closed/), so the
# complete image is built. Such a run publishes no image, no SDK or
# ImageBuilder and no logs of the closed packages: only the reports.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "GL.iNet release to recreate (a row of openwrt/gl-releases.tsv)"
        type: string
        default: "4.2.0"
      ccache:
        description: "Use ccache (wrapped invisibly; off for the final validation run: GL.iNet built without it)"
        type: boolean
        default: true
      publish_sdk:
        description: "Build and publish the OpenWrt SDK and ImageBuilder (takes several minutes; only needed when toolchain, kernel or packages change)"
        type: boolean
        default: false
      closed:
        description: "Complete image: add GL.iNet's closed packages, generated in the run from the official image (publishes only reports)"
        type: boolean
        default: false

permissions:
  contents: write   # publish the SDK as a release (open-source tooling only)

env:
  FORK: https://github.com/spmadden/gl-infra-builder.git
  MTK_FEED_OLD: https://git01.mediatek.com/openwrt/feeds/mtk-openwrt-feeds.git
  MTK_FEED_MIRROR: https://github.com/gl-inet/mtk-openwrt-feeds.git
  # Everything that differs per release is a row of openwrt/gl-releases.tsv,
  # loaded into work/release.env by the first step:
  #   FORK_TAG          the builder tag committed about an hour before the
  #                     release's build time
  #   OFFICIAL_URL/_SHA256  the official image (from GL.iNet's firmware API)
  #   SOURCE_DATE_EPOCH GL.iNet's build time, from the official kernel banner
  #                     (OpenWrt prints it with gmtime); written to
  #                     version.date, also used for other build timestamps
  #   GIT_COMMIT_DATE   commit date of the applied patches (opkg
  #                     SourceDateEpoch of the OpenWrt-tree packages)
  #   VERSION_DATE, GL_TYPE  /etc/version.date and gl_metadata's type, as in
  #                     the official image
  #   AGH_VERSION, AGH_SHA256  AdGuard's release binary in gl-sdk4-adguardhome
  #   EARLY_PATCHES     number of leading patches committed one second
  #                     earlier (GL.iNet's git am crossed a second boundary;
  #                     visible in SourceDateEpoch, e.g. uboot-envtools in 4.2.1)
  #   LATE_PATCHES      number of trailing patches committed one second later
  #                     (dnsmasq and odhcpd in 4.2.3)
  #   REBUILT_PACKAGES  packages GL.iNet's tree had built before ("-": none).
  #                     A package defined before its ABI-versioned sibling in
  #                     the same Makefile (curl/libcurl, libc/libgcc) gets the
  #                     sibling's ABI name in Depends only if the sibling's
  #                     pkginfo file already exists when make reads the
  #                     Makefile: plain in 4.1.1-4.2.0 and 4.5.0-4.8.2, ABI
  #                     names in 4.2.1-4.4.6 and 4.9.0
  #   PRIVATE_NOW       packages of openwrt/gl-4.2.0-closed/built-from-public.txt
  #                     that this release's public feeds no longer have
  #                     ("-": none); taken from the official image instead
  #                     (gl-sdk4-tertf left gl-feeds after 4.2.1)
  #   PATCHES_REV       builder commit whose patches-mt798x-7.6.6.1 folder is
  #                     used ("-": FORK_TAG's own). GL.iNet built 4.4.5 from a
  #                     release branch: profiles and feeds of early August, but
  #                     the kernel and package patches from before 13 July 2023
  #                     (no modem rework, wireguard fix or kmwan in the image).
  #                     Further words file=commit take single patch files from
  #                     another commit (fixes picked onto the release branch:
  #                     4.4.6 has the wireguard fix of 14 July)
  #   EXTRA_CONFIG      extra .config lines, space-separated ("-": none), for
  #                     options from GL.iNet's private profiles (4.4.5: busybox
  #                     usleep; 4.5.0: Samba without AD DC and VFSX, so no
  #                     Python; no kmod-dm/kmod-dax (DAX=m would keep device
  #                     mapper a module), libcurl without nghttp2)
  #   FEED_REVS         public feed revisions as name=commit, space-separated
  #                     ("-": the profiles' own). From 4.5.0 on the builder
  #                     isn't public; the gl-feeds revisions follow from the
  #                     image (each package's SourceDateEpoch is the last
  #                     commit to its folder; analysis/release-values.py);
  #                     name=url^commit adds a feed the profiles don't have
  #                     (mptcp_feeds from 4.7.0 on); a ~shallow suffix: GL.iNet
  #                     fetched that feed by branch (depth 1), so all its
  #                     packages carry the head commit's date (4.6.2's
  #                     gl_feed_21_02, 4.7.0's gl_feed_common)
  #   EXTRA_COMMITS     folders of openwrt/gl-extra-commits ("-": none):
  #                     GL.iNet patch commits missing from the public patch set
  #                     (4.5.0+), recreated with the release's patch date
  #   NO_GIT            1: GL.iNet built from a tree without git metadata
  #                     (4.8.2 on: empty revision everywhere, also in the
  #                     toolchain's version string); the tree's .git is removed
  #                     before compiling, and OpenWrt then dates its packages by
  #                     the mtime of scripts/get_source_date_epoch.sh (try_mtime),
  #                     set to the build time; getver.sh prints an empty
  #                     revision (as GL.iNet's). Feeds keep their git.

jobs:
  recreate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /usr/share/miniconda
          sudo docker image prune -af > /dev/null
          df -h /

      - name: Restore cache (downloads, ccache)
        uses: actions/cache/restore@v6
        with:
          path: work/cache
          key: gl-recreate-${{ inputs.release }}-${{ github.run_id }}
          restore-keys: |
            gl-recreate-${{ inputs.release }}-
            gl-recreate-

      - name: Fetch the official release and list its packages
        timeout-minutes: 20
        env:
          CLOSED: ${{ inputs.closed }}
        run: |
          sudo apt-get install -y -q squashfs-tools > /dev/null
          mkdir -p work/out work/cache/dl work/cache/ccache work/cmp
          # This release's values (see env), for this and all later steps
          REL="${{ inputs.release }}"
          case "$REL" in ""|false) REL=4.2.0 ;; esac
          awk -F'\t' -v r="$REL" -v q="'" '$1 == r { f = 1
              n = split("RELEASE FORK_TAG OFFICIAL_URL OFFICIAL_SHA256 SOURCE_DATE_EPOCH GIT_COMMIT_DATE VERSION_DATE GL_TYPE AGH_VERSION AGH_SHA256 EARLY_PATCHES REBUILT_PACKAGES PRIVATE_NOW LATE_PATCHES PATCHES_REV EXTRA_CONFIG FEED_REVS EXTRA_COMMITS NO_GIT", k, " ")
              for (i = 1; i <= n; i++) print k[i] "=" q $i q }
            END { exit !f }' openwrt/gl-releases.tsv > work/release.env \
            || { echo "release $REL not in openwrt/gl-releases.tsv"; exit 1; }
          cat work/release.env
          set -a; . work/release.env; set +a
          cd work/cmp
          curl -fSL --connect-timeout 30 --max-time 600 --retry 5 --retry-delay 10 \
            --retry-all-errors -o official.bin "$OFFICIAL_URL"
          echo "${OFFICIAL_SHA256}  official.bin" | sha256sum -c -
          mkdir official && tar -xf official.bin -C official
          sudo unsquashfs -q -d off_root official/*/root > /dev/null
          # GL.iNet's build-machine order of iproute2's static-syms table, read
          # from its ip-full (used by openwrt/gl-4.2.0-patches/iproute2)
          sudo python3 -I "$GITHUB_WORKSPACE/.github/scripts/link-order.py" iproute2 \
            off_root/usr/libexec/ip-full > ../link-order-ip.txt || : > ../link-order-ip.txt
          echo "iproute2 table order: $(wc -l < ../link-order-ip.txt) names"
          if [ "$CLOSED" = true ]; then
            # GL.iNet's closed packages and image-level files, from the official
            # image (stays inside the run)
            C="$GITHUB_WORKSPACE/openwrt/gl-4.2.0-closed"
            sudo python3 -I "$GITHUB_WORKSPACE/.github/scripts/gen-closed-feed.py" off_root ../closed "$C" "--private-now=$PRIVATE_NOW" > ../out/closed-feed.txt
            sudo python3 -I - off_root ../closed-image "$C/image-files.txt" << 'PY'
          import os, shutil, sys
          root, out, lst = sys.argv[1:4]
          for rel in open(lst).read().split():
              s, t = os.path.join(root, rel), os.path.join(out, rel)
              if not os.path.lexists(s):   # the list covers several releases
                  print("not in this release:", rel)
                  continue
              os.makedirs(os.path.dirname(t), exist_ok=True)
              os.symlink(os.readlink(s), t) if os.path.islink(s) else shutil.copy2(s, t)
          PY
            sudo chown -R "$(id -u):$(id -g)" ../closed ../closed-image
            # This release's AdGuardHome binary
            sed -i -e "s/@AGH_VERSION@/$AGH_VERSION/g" -e "s/@AGH_SHA256@/$AGH_SHA256/g" \
              ../closed/glinet/gl-sdk4-adguardhome/Makefile
            wc -l ../out/closed-feed.txt
          fi
          # GL.iNet's public build key (base-files installs it as
          # /etc/opkg/keys/<fingerprint>), taken from the official image at run time
          k=$(grep '^/etc/opkg/keys/' off_root/usr/lib/opkg/info/base-files.list | grep -v 2f8b0b98e08306bf | head -1)
          cp "off_root$k" ../gl-build-key.pub && echo "GL.iNet build key: $k"
          # Package names as in .config: drop the ABI suffix (libjson-c5 -> libjson-c).
          python3 - off_root/usr/lib/opkg/status > ../official-packages.txt << 'PY'
          import sys
          for block in open(sys.argv[1], errors="replace").read().split("\n\n"):
              f = dict(l.split(": ", 1) for l in block.splitlines() if ": " in l)
              if "Package" in f:
                  name, abi = f["Package"], f.get("ABIVersion", "")
                  print(name[:-len(abi)] if abi and name.endswith(abi) else name)
          PY
          sort -o ../official-packages.txt ../official-packages.txt
          wc -l ../official-packages.txt

      - name: Write build script
        run: |
          cp -r openwrt/gl-4.2.0-patches work/
          cp .github/scripts/link-order.py work/   # used by the sipcalc recipe
          cp -r openwrt/gl-extra-commits work/
          cat > work/build.sh << 'EOF'
          #!/usr/bin/env bash
          # Runs inside ubuntu:20.04 (OpenWrt 21.02 predates newer hosts).
          set -euxo pipefail
          if [ "$(id -u)" = 0 ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            apt-get install -y -q build-essential ccache ecj fastjar file g++ gawk \
              gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
              python3 python3-dev python3-distutils python3-setuptools python3-yaml \
              rsync subversion swig time unzip wget curl ca-certificates xsltproc \
              zlib1g-dev squashfs-tools zstd net-tools
            # net-tools: openvpn's configure records the build host's ifconfig
            # path; GL.iNet's official binary has /usr/sbin/ifconfig.
            # GL.iNet built as a normal user: OpenWrt's strip step can't write
            # read-only files then (libdevmapper, installed 0555, stays
            # unstripped in the official image; as root it gets stripped).
            # User "glinet" (their build path is /home/glinet/...), with the
            # uid that owns /work so outputs stay writable for the runner.
            useradd -m -u "$(stat -c %u /work)" -s /bin/bash glinet
            mkdir -p /home/glinet/work && chown -R glinet: /home/glinet /work
            exec runuser -u glinet -- bash "$0"
          fi
          # Samba's build system (waf) orders libraries via Python sets, so the
          # link order follows Python's hash seed, random by default (GL.iNet's
          # 4.2.0 and 4.7.4 builds of the same Samba differ in 140 of 213
          # libraries). A fixed seed makes our own builds repeatable; GL.iNet's
          # random order itself can't be reproduced. (OpenWrt's .pyc
          # compilation sets its own seed and is unaffected.)
          export PYTHONHASHSEED=0
          # This release's values (written by the first step; see env)
          set -a; . /work/release.env; set +a
          git config --global user.email ci@invalid.invalid
          git config --global user.name ci
          git config --global --add safe.directory '*'

          # GL.iNet's build path, as embedded in the official binaries
          # (/home/glinet/work/_github/mt7981/{build_dir,staging_dir}): paths end
          # up in binaries, Python bytecode and build IDs.
          git clone "$FORK" /home/glinet/work/_github
          cd /home/glinet/work/_github
          git checkout "$FORK_TAG"
          if [ "${PATCHES_REV:--}" != - ]; then
            # this release's patch set (see env); files added later go too
            set -- $PATCHES_REV
            git rm -rq patches-mt798x-7.6.6.1
            git checkout "$1" -- patches-mt798x-7.6.6.1
            shift
            for p in "$@"; do
              git checkout "${p#*=}" -- "patches-mt798x-7.6.6.1/${p%%=*}"
              echo "patch ${p%%=*} from ${p#*=}"
            done
            ls patches-mt798x-7.6.6.1 | wc -l
          fi

          # GL.iNet's own step: clone OpenWrt, reset to bcaabe6d, git am the patches.
          # Commit date of the applied patches = GL.iNet's (opkg SourceDateEpoch
          # of the OpenWrt-tree packages in the official image).
          export GIT_COMMITTER_DATE="$GIT_COMMIT_DATE +0000"
          python3 setup.py -c configs/config-mt798x-7.6.6.1.yml
          unset GIT_COMMITTER_DATE
          cd mt7981
          if [ "${EARLY_PATCHES:-0}" -gt 0 ] || [ "${LATE_PATCHES:-0}" -gt 0 ]; then
            # the first EARLY_PATCHES patch commits one second earlier, the last
            # LATE_PATCHES one second later (see env)
            all=$(git log --reverse --format='%H %ct' | awk -v d="$GIT_COMMIT_DATE" '$2 == d { printf "%s ", $1 }')
            n=$(echo $all | wc -w)
            early=$(echo $all | tr ' ' '\n' | awk -v e="${EARLY_PATCHES:-0}" 'NR <= e' | tr '\n' ' ')
            late=$(echo $all | tr ' ' '\n' | awk -v n="$n" -v l="${LATE_PATCHES:-0}" 'NR > n - l' | tr '\n' ' ')
            first=$(echo $early $late | awk '{ print $1 }')
            FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter \
              "case ' $early ' in *\" \$GIT_COMMIT \"*) export GIT_COMMITTER_DATE='$((GIT_COMMIT_DATE - 1)) +0000' ;; esac
               case ' $late ' in *\" \$GIT_COMMIT \"*) export GIT_COMMITTER_DATE='$((GIT_COMMIT_DATE + 1)) +0000' ;; esac" \
              -- "$first^..HEAD"
          fi
          git log --reverse --format='%ct %s' -n 45 | awk 'NR <= 12'   # first patch commits
          # GL.iNet patch commits missing from the public patch set (see env)
          for c in ${EXTRA_COMMITS:--}; do
            [ "$c" = - ] && continue
            d=/work/gl-extra-commits/$c
            if [ -d "$d/files" ]; then
              cp -r "$d/files/." .
              (cd "$d/files" && find . -type f) | xargs git add
            fi
            if [ -f "$d/edit.sh" ]; then sh "$d/edit.sh"; fi
            git add -A -- target package toolchain tools include   # files edit.sh created
            GIT_COMMITTER_DATE="$GIT_COMMIT_DATE +0000" GIT_AUTHOR_DATE="$GIT_COMMIT_DATE +0000" \
              git commit -q -a --allow-empty -m "$(cat "$d/message")"
          done
          git log --oneline -3

          # GL.iNet's build time (see env): get_source_date_epoch.sh reads
          # version.date first; an environment variable would be overridden.
          echo "$SOURCE_DATE_EPOCH" > version.date

          # Cached downloads.
          rm -rf dl && ln -s /work/cache/dl dl

          # MediaTek's feed moved behind a login; same commit from GL.iNet's mirror.
          sed -i "s#${MTK_FEED_OLD}#${MTK_FEED_MIRROR}#" feeds.conf.default
          # FEED_REVS entries for feeds of feeds.conf.default (MediaTek's: 4.7.0
          # was built with its November 2024 state) are set there; the rest
          # go to the profiles below
          rest=""
          for x in ${FEED_REVS:--}; do
            n=${x%%=*}; v=${x#*=}
            if grep -q "^src-git[a-z-]* $n " feeds.conf.default; then
              sed -i -E "s#^(src-git[a-z-]* $n ).*#\1${v%%~*}#" feeds.conf.default
            else rest="$rest $x"; fi
          done
          export FEED_REVS="${rest# }"
          cat feeds.conf.default

          # Public copies of GL.iNet's two MT2500 profiles: drop private feeds
          # and the packages that only exist there.
          python3 - << 'PY'
          import os, yaml
          private_feeds = {"glinet", "mt7981", "mt798x"}
          # this release's feed revisions (see env)
          revs = dict(x.split("=", 1) for x in os.environ.get("FEED_REVS", "-").split() if "=" in x)
          # kmod-gl-sdk4-tertf and -hw-info are public (gl_feed_common at the
          # recipe's commit), so they are built from source.
          private_pkgs = {"fwdd", "kmod-mtfwd", "kmod-mtqos", "mtk-base-files",
                          "kmod-gl-sdk4-parental-control"}
          def private(p):
              name = p.split(":")[0]
              return (name in private_pkgs or name.startswith(("gl-sdk4", "gl-oui", "oui-")))
          removed = []
          for src, dst in (("target_mt7981_gl-mt2500", "public_target_mt2500"),
                           ("glinet_mt2500", "public_glinet_mt2500")):
              d = yaml.safe_load(open(f"profiles/{src}.yml"))
              d["feeds"] = [f for f in d.get("feeds", []) if f.get("name") not in private_feeds]
              for f in d["feeds"]:
                  if f.get("name") in revs:
                      f.pop("branch", None)
                      f["revision"] = revs.pop(f["name"]).split("~")[0]
                      print(f"feed {f['name']} at {f['revision']}")
              if src.startswith("target_"):
                  # feeds GL.iNet added after the public builder (name=url^commit)
                  for name in [n for n, v in revs.items() if "^" in v]:
                      uri, rev = revs.pop(name).split("~")[0].rsplit("^", 1)
                      d["feeds"].append({"name": name, "uri": uri, "revision": rev})
                      print(f"feed {name} added: {uri} at {rev}")
              keep = [p for p in d.get("packages", []) if not private(p)]
              removed += [f"{src}: {p}" for p in d.get("packages", []) if private(p)]
              d["packages"] = keep
              yaml.safe_dump(d, open(f"profiles/{dst}.yml", "w"), sort_keys=False)
          assert not revs, f"FEED_REVS names feeds the profiles don't have: {revs}"
          open("/work/out/removed-packages.txt", "w").write("\n".join(removed) + "\n")
          print(f"{len(removed)} private packages left out")
          PY

          # gen_config.py writes /etc/glversion and /etc/version.type from
          # gl_metadata.yaml (not in the public recipe) and /etc/version.date
          # from the clock (local time); use GL.iNet's values from the official
          # image.
          printf 'version: %s\ntype: %s\n' "$RELEASE" "$GL_TYPE" > gl_metadata.yaml
          ./scripts/gen_config.py public_target_mt2500 public_glinet_mt2500
          # Feeds GL.iNet fetched by branch (FEED_REVS ...~shallow): OpenWrt's
          # feeds script clones those with depth 1, so every package's
          # SourceDateEpoch is the head commit's time. Same effect offline: mark
          # the pinned head as the history's root.
          for x in ${FEED_REVS:--}; do
            case "$x" in *~shallow)
              n=${x%%=*}
              git -C "feeds/$n" rev-parse HEAD > "feeds/$n/.git/shallow"
              echo "feed $n shallow at $(cat "feeds/$n/.git/shallow")" ;;
            esac
          done
          echo "$VERSION_DATE" > files/etc/version.date

          # Mirror the official package set: make every feed package
          # selectable, select what the official image has (except GL.iNet's
          # closed/private packages), then deselect whatever we have extra.
          ./scripts/feeds install -a > /dev/null
          # Our own patches for build-machine effects GL.iNet's build had
          # (openwrt/gl-4.2.0-patches/<package>/), e.g. iproute2's directory order.
          # base-files installs the build key's public half as
          # /etc/opkg/keys/<fingerprint>: install GL.iNet's instead (our own
          # key still signs the package index, which isn't in the image)
          sed -i '/etc\/opkg\/keys\//s#$(BUILD_KEY)\.pub#/work/gl-build-key.pub#g' package/base-files/Makefile
          grep -n 'opkg/keys/' package/base-files/Makefile
          # Every copy of the package gets them: from 4.7.0 on, the MPTCP
          # feed's iproute2 6.3.0 replaces OpenWrt's (CONFIG_OVERRIDE_PKGS)
          for d in /work/gl-4.2.0-patches/*/; do
            find package feeds -path "*/$(basename "$d")/Makefile" | while read -r m; do
              t="$(dirname "$m")/patches"
              mkdir -p "$t" && cp "$d"*.patch "$t/" && echo "patches for $(basename "$d") -> $t"
            done
          done
          if [ "${CLOSED:-}" = true ]; then
            # GL.iNet's closed packages (generated in the run), copied into the
            # tree (src-cpy) so their Source: reads feeds/...; umask 022 as in
            # a normal build environment (folder modes end up in the packages)
            # One feed per folder the generator wrote (named after the official
            # Source: glinet, and mt7981 up to 4.5.16, mt798x from 4.6.2 on)
            F=feeds.conf; [ -f "$F" ] || F=feeds.conf.default
            closed_feeds=$(cd /work/closed && ls -d */ | tr -d /)
            for f in $closed_feeds; do printf 'src-cpy %s /work/closed/%s\n' "$f" "$f" >> "$F"; done
            ( umask 022; ./scripts/feeds update $closed_feeds > /dev/null )
            # OpenWrt names a source package after its folder: GL.iNet's
            # gl-ui4.0/module/adguardhome (gl-sdk4-ui-adguardhome) clashes with
            # the packages feed's adguardhome (not in the official image), and
            # only the first one gets installed
            ./scripts/feeds uninstall adguardhome > /dev/null
            for f in $closed_feeds; do ./scripts/feeds install -a -p "$f" > /dev/null; done
            ./scripts/feeds install -a > /dev/null
          fi
          python3 - << 'PY'
          import os, re, subprocess
          official = {l.strip() for l in open("/work/official-packages.txt") if l.strip()}
          def private(p):
              if os.environ.get("CLOSED") == "true":   # closed packages generated in the run
                  return False
              if p in {"kmod-gl-sdk4-tertf", "kmod-gl-sdk4-hw-info"}:   # public source
                  return False
              return (p.startswith(("gl-sdk4", "gl-oui", "oui-", "kmod-gl-sdk4", "libgl"))
                      or p in {"fwdd", "kmod-mtfwd", "kmod-mtqos", "mtk-base-files", "gl-line-graph"})
          wanted = sorted(p for p in official if not private(p))
          # gen_config.py's defconfig already wrote "# CONFIG_PACKAGE_kmod-x is
          # not set" lines; Kconfig keeps those explicit values, so
          # CONFIG_ALL_KMODS=y (a default) would not change them. Drop them.
          cfg = open(".config").read()
          cfg = re.sub(r"^# CONFIG_PACKAGE_kmod-\S+ is not set\n", "", cfg, flags=re.M)
          open(".config", "w").write(cfg)
          with open(".config", "a") as f:
              # OpenWrt's own ccache mode stays off: it calls the compiler as
              # "ccache_cc", which programs record (nginx --with-cc, Python's
              # sysconfig). ccache, when wanted, is wrapped in invisibly below.
              f.write("CONFIG_DEVEL=y\n# CONFIG_CCACHE is not set\n"
                      "CONFIG_ALL_KMODS=y\n"
                      + ("CONFIG_SDK=y\nCONFIG_IB=y\n" if os.environ.get("PUBLISH_SDK") == "true" and os.environ.get("CLOSED") != "true"
                         else "# CONFIG_SDK is not set\n# CONFIG_IB is not set\n") +
                      # GL.iNet's kernel banner: "5.4.211 (glinet@glinet)"; the
                      # string length shifts all later read-only data.
                      "CONFIG_KERNEL_BUILD_USER=\"glinet\"\nCONFIG_KERNEL_BUILD_DOMAIN=\"glinet\"\n"
                      # LuCI builds translation packages only for enabled
                      # languages; the official image has en and zh-cn ones.
                      # (en only without the closed packages: with them, a closed
                      # package depends on luci-i18n-base-en, and LUCI_LANG_en would
                      # add English translations of every LuCI app, more than GL.iNet had)
                      + ("" if os.environ.get("CLOSED") == "true" else "CONFIG_LUCI_LANG_en=y\n") +
                      "CONFIG_LUCI_LANG_zh_Hans=y\n"
                      # no WSD daemon: the official image has no wsdd2 (default y,
                      # selected by samba4-server)
                      "# CONFIG_SAMBA4_SERVER_WSDD2 is not set\n"
                      # Samba as GL.iNet built it: AD DC support (its samba4-libs
                      # depends on acl, jansson, libarchive, libopenldap,
                      # python3-cryptodome).
                      "CONFIG_SAMBA4_SERVER_AD_DC=y\n"
                      # ... and the extended VFS modules (commit, dirsort, fileid,
                      # shell_snap, virusfilter, worm in the official image), which
                      # also changes how smbd and the libraries are linked.
                      "CONFIG_SAMBA4_SERVER_VFSX=y\n"
                      # BusyBox user and group applets as in GL.iNet's own
                      # profiles glinet_nas.yml / glinet_depends.yml: the
                      # official busybox has addgroup, adduser, chpasswd,
                      # delgroup and deluser (not in the public MT2500 profile).
                      "CONFIG_BUSYBOX_CONFIG_ADDGROUP=y\nCONFIG_BUSYBOX_CONFIG_FEATURE_ADDUSER_TO_GROUP=y\n"
                      "CONFIG_BUSYBOX_CONFIG_ADDUSER=y\nCONFIG_BUSYBOX_CONFIG_CHPASSWD=y\n"
                      "CONFIG_BUSYBOX_CONFIG_DELUSER=y\nCONFIG_BUSYBOX_CONFIG_DELGROUP=y\n"
                      "CONFIG_BUSYBOX_CONFIG_FEATURE_DEL_USER_FROM_GROUP=y\n")
              # this release's extra options (see env)
              if os.environ.get("EXTRA_CONFIG", "-") != "-":
                  f.write("".join(l + "\n" for l in os.environ["EXTRA_CONFIG"].split()))
              # nginx as GL.iNet built it (configure arguments in the official
              # binary): Lua and ubus, no naxsi/headers-more, 22 modules off.
              f.write("CONFIG_NGINX_LUA=y\n# CONFIG_NGINX_NAXSI is not set\n"
                      "# CONFIG_NGINX_HEADERS_MORE is not set\n# CONFIG_NGINX_HTTP_CACHE is not set\n")
              for m in ("ACCESS AUTH_BASIC AUTOINDEX BROWSER CHARSET EMPTY_GIF GEO GZIP LIMIT_CONN "
                        "LIMIT_REQ MAP MEMCACHED REFERER SCGI SPLIT_CLIENTS SSI UPSTREAM_HASH "
                        "UPSTREAM_IP_HASH UPSTREAM_KEEPALIVE UPSTREAM_LEAST_CONN USERID").split():
                  f.write(f"# CONFIG_NGINX_HTTP_{m} is not set\n")
              # Kernel module packages from feeds GL.iNet's build didn't have
              # (run 4: the only 17 kernel options left that differ).
              for k in ("dm-raid", "usb-test", "sound-soc-core", "sound-soc-ac97",
                        "sound-soc-mt79xx", "sound-soc-spdif", "openvswitch",
                        "openvswitch-intree", "openvswitch-geneve", "openvswitch-geneve-intree",
                        "openvswitch-gre", "openvswitch-gre-intree", "openvswitch-vxlan",
                        "openvswitch-vxlan-intree", "openvswitch-lisp-intree",
                        "openvswitch-stt-intree"):
                  f.write(f"# CONFIG_PACKAGE_kmod-{k} is not set\n")
              # gl_feed_common's fan driver (from January 2024) needs headers of
              # GL.iNet's closed gl-sdk4-utils; no MT2500 image ships it
              f.write("# CONFIG_PACKAGE_kmod-gl-sdk4-fan is not set\n")
              for p in wanted:
                  f.write(f"CONFIG_PACKAGE_{p}=y\n")
          subprocess.run(["make", "defconfig"], check=True)
          cfg = open(".config").read()
          selected = set(re.findall(r"^CONFIG_PACKAGE_(\S+)=y$", cfg, re.M))
          # Only real packages: CONFIG_PACKAGE_dnsmasq_full_ipset and the like
          # are build options of a package, not packages.
          real = set(re.findall(r"^Package: (\S+)$", open("tmp/.packageinfo").read(), re.M))
          extra = sorted((selected - official) & real)
          missing = sorted(p for p in wanted if p not in selected)
          with open(".config", "a") as f:
              for p in extra:
                  f.write(f"# CONFIG_PACKAGE_{p} is not set\n")
          subprocess.run(["make", "defconfig"], check=True)
          selected = set(re.findall(r"^CONFIG_PACKAGE_(\S+)=y$", open(".config").read(), re.M))
          open("/work/out/mirror.txt", "w").write(
              f"official packages: {len(official)}; wanted (public): {len(wanted)}\n"
              f"not selectable (no such package in the public feeds): {len(missing)}\n  " + " ".join(missing) + "\n"
              f"extra deselected: {len(extra)}\n  " + " ".join(extra) + "\n"
              f"still extra after deselect: " + " ".join(sorted(selected - official)) + "\n")
          print(open("/work/out/mirror.txt").read())
          PY

          if [ "${CLOSED:-}" = true ]; then
            # GL.iNet's image-level files (owned by no package): files/ overlay
            cp -a /work/closed-image/. files/
          fi
          cp .config /work/out/config.txt
          grep -E "^CONFIG_(DEVEL|CCACHE|ALL_KMODS)=" .config
          if [ "${DRY_RUN:-}" = 1 ]; then
            # Preflight (local runs): everything up to the configuration ran
            # (builder, patches, extra commits, feeds, closed feed); stop before
            # compiling. Fails if official packages can't be selected, which
            # would otherwise only show at package/install, at the very end.
            # (the kernel pseudo-package has no CONFIG_PACKAGE_ option: always listed)
            n=$(sed -n '3p' /work/out/mirror.txt | tr ' ' '\n' | grep -c -v -x -e kernel -e '' || true)
            { echo "preflight: $([ "$n" = 0 ] && echo OK || echo FAILED)"; cat /work/out/mirror.txt
              echo "revision: $(./scripts/getver.sh 2>/dev/null)"; } | tee /work/out/preflight.txt
            [ "$n" = 0 ]; exit
          fi
          # Logs per package (BUILD_LOG) and a summary of failed packages are
          # saved even when the build fails.
          save_logs() {
            mkdir -p /work/out
            # (not the closed packages' logs: they name GL.iNet's files)
            [ -d logs ] && tar -czf /work/out/build-logs.tar.gz \
              --exclude=logs/package/feeds/glinet --exclude=logs/package/feeds/mt7981 logs || true
            { grep -h "ERROR: " /work/out/progress.log 2>/dev/null | sort -u
              for f in $(grep -rl -E "Error [0-9]|error:" logs 2>/dev/null | head -20); do
                echo "== $f"; grep -E -B3 "Error [0-9]|error:" "$f" | tail -12; done
            } > /work/out/failed.txt || true
          }
          trap save_logs EXIT
          if [ "${NO_GIT:-0}" = 1 ]; then
            # (see env) after every patch and edit, right before compiling
            rm -rf .git
            # git must not find the builder's repository around the tree
            GIT_CEILING_DIRECTORIES="$(dirname "$PWD")"; export GIT_CEILING_DIRECTORIES
            touch -d "@$SOURCE_DATE_EPOCH" scripts/get_source_date_epoch.sh
            # GL.iNet's revision is empty, not getver.sh's "unknown" (as with
            # SDK=1 or an empty REVISION; our construction, same effect)
            sed -i 's/REV="unknown"$/REV=""/' scripts/getver.sh
            echo "tree without git: revision '$(./scripts/getver.sh)'"
          fi
          make download -j8 || make download -j1 V=s
          if [ "$USE_CCACHE" = "true" ]; then
            # ccache in disguise: after building the toolchain, each compiler
            # becomes a wrapper with its own name that runs ccache on the real
            # binary (.<name>.real), so recorded compiler names stay as GL.iNet's.
            # A separate cache, filled only at GL.iNet's build path.
            # The toolchain is rebuilt every run, so its mtime changes; compare
            # the compiler by content instead, or every run misses the cache.
            export CCACHE_DIR=/work/cache/ccache-glpath CCACHE_MAXSIZE=5G CCACHE_COMPILERCHECK=content
            rm -rf /work/cache/ccache
            # Host tools cache (ccache runs only, so never in validation runs):
            # the tools don't depend on the release, only on tools/, include/
            # and rules.mk (hashed into the key, so GL.iNet's patches to tools
            # give a new key) and the host compiler. OpenWrt's own stamp name
            # encodes which tools are enabled, so another selection rebuilds.
            # Restored files get the current time: newer than the fresh tree,
            # so make sees them as up to date.
            tkey=$( { find tools include rules.mk -type f -print0 | sort -z | xargs -0 sha1sum; gcc --version; } | sha1sum | cut -c1-16)
            tcache=/work/cache/hosttools/$tkey.tar
            if [ -f "$tcache" ]; then
              tar -xf "$tcache" && find staging_dir/host build_dir/host -exec touch -h {} + && echo "host tools from cache $tkey"
            fi
            make -j"$(nproc)" BUILD_LOG=1 tools/install
            if [ ! -f "$tcache" ]; then
              mkdir -p /work/cache/hosttools && rm -f /work/cache/hosttools/*.tar
              tar -cf "$tcache.tmp" staging_dir/host build_dir/host && mv "$tcache.tmp" "$tcache" && echo "host tools cached as $tkey"
            fi
            # Toolchain cache (ccache runs only), for reruns of a release: the
            # key covers the host tools key, the revision (in GCC's version
            # string), version.date, the whole .config and the content of
            # toolchain/ and target/linux/ (kernel headers, GL.iNet's kernel
            # patches, our extra commits). Saved after the ccache wrappers.
            ckey=$( { echo "$tkey"; ./scripts/getver.sh; cat version.date; sha1sum .config
                      find toolchain target/linux -type f -print0 | sort -z | xargs -0 sha1sum; } | sha1sum | cut -c1-16)
            ccache_tc=/work/cache/toolchain/$ckey.tar
            if [ -f "$ccache_tc" ]; then
              tar -xf "$ccache_tc" && find staging_dir/toolchain-* build_dir/toolchain-* -exec touch -h {} + \
                && echo "toolchain from cache $ckey"
            fi
            make -j"$(nproc)" BUILD_LOG=1 toolchain/install
            for c in staging_dir/toolchain-*/bin/aarch64-openwrt-linux-musl-{gcc,g++,c++,cpp} \
                     staging_dir/toolchain-*/bin/aarch64-openwrt-linux-{gcc,g++,c++,cpp}; do
              [ -f "$c" ] && [ ! -L "$c" ] && [ ! -e "$(dirname "$c")/.$(basename "$c").real" ] || continue
              mv "$c" "$(dirname "$c")/.$(basename "$c").real"
              # (falls back to the real compiler without ccache: the SDK built in
              # this run carries these wrappers)
              printf '#!/bin/sh\nr="$(dirname "$0")/.%s.real"\ncommand -v ccache >/dev/null && exec ccache "$r" "$@"\nexec "$r" "$@"\n' "$(basename "$c")" > "$c"
              chmod +x "$c"; echo "ccache wrapper: $c"
            done
            if [ ! -f "$ccache_tc" ]; then
              # keep the 4 most recent toolchains of this worker
              mkdir -p /work/cache/toolchain
              { ls -t /work/cache/toolchain/*.tar 2>/dev/null || true; } | tail -n +4 | xargs -r rm -f
              tar -cf "$ccache_tc.tmp" staging_dir/toolchain-* build_dir/toolchain-* \
                && mv "$ccache_tc.tmp" "$ccache_tc" && echo "toolchain cached as $ckey"
            fi
          fi
          if [ "${REBUILT_PACKAGES:--}" != "-" ]; then
            # build these once and clean them (clean keeps pkginfo/*.version),
            # so the main build builds them again, as GL.iNet's tree did (see env)
            make -j"$(nproc)" BUILD_LOG=1 tools/install toolchain/install   # (done above with ccache)
            for p in $REBUILT_PACKAGES; do make -j"$(nproc)" BUILD_LOG=1 "$p/compile"; done
            for p in $REBUILT_PACKAGES; do make "$p/clean"; done
          fi
          # bpftools runs the build's host Python, which a parallel build may
          # still be installing ("Fatal Python error: init_fs_encoding", jobs
          # 25 and 57): build host Python first. (Host-only; target package
          # metadata is unaffected, unlike a retry, whose second make reads the
          # recipes with more packages built: ABI names in Depends, job 57.)
          if [ -d package/feeds/packages/python3 ]; then
            make -j"$(nproc)" BUILD_LOG=1 package/feeds/packages/python3/host/compile
          fi
          build_retry() {
            # a package that failed (e.g. a parallel-build race, job 25's
            # bpftools) is built once more single-threaded before giving up
            make -j"$(nproc)" BUILD_LOG=1 && return
            failed=$(grep -h -o "ERROR: package/[^ ]* failed to build" /work/out/progress.log | awk '{print $2}' | sort -u)
            [ -n "$failed" ] || return 1
            echo "retrying once, single-threaded: $failed"
            for p in $failed; do make -j1 BUILD_LOG=1 "$p/compile" || return 1; done
            make -j"$(nproc)" BUILD_LOG=1
          }
          build_retry || {
            # package/install writes no log with BUILD_LOG: keep opkg's error lines
            make package/install V=s 2>&1 | grep -i -E "error|cannot|collide|clash|satisf|unknown package|not found" \
              | sort -u | head -60 > /work/out/install-errors.txt || true
            cat /work/out/install-errors.txt; exit 1; }
          ls -l bin/targets/mediatek/mt7981/
          # the order opkg installed the packages in (it decides which ones
          # are marked Auto-Installed in /usr/lib/opkg/status); the assembly
          # replays it
          cp tmp/opkg_install_list /work/out/opkg-install-list.txt || true
          mkdir -p /work/out/sdk
          mv bin/targets/mediatek/mt7981/openwrt-sdk-*.tar.* /work/out/sdk/ || true
          # The ImageBuilder (with all packages of this build, IB_STANDALONE) and
          # the generated files/ (version stamps): the private repo assembles
          # the complete image from these plus GL.iNet's closed packages.
          mv bin/targets/mediatek/mt7981/openwrt-imagebuilder-*.tar.* /work/out/sdk/ || true
          # plus /init, which the full build copies in during the kernel build
          # (include/kernel-defaults.mk) and the ImageBuilder doesn't
          if [ "${PUBLISH_SDK:-}" = true ] && [ "${CLOSED:-}" != true ]; then
            rm -rf /tmp/glf && mkdir -p /tmp/glf && cp -a files /tmp/glf/
            install -m 0755 target/linux/generic/other-files/init /tmp/glf/files/init
            tar -C /tmp/glf -czf /work/out/sdk/gl-files.tar.gz files
            cp /work/out/opkg-install-list.txt /work/out/sdk/ || true
          fi
          # The SDK leaves out driver-private headers; the Ethernet/PPE driver
          # folder as compiled (all patches applied) lets out-of-tree builds
          # of mtk_hnat find "../mtk_eth_soc.h" etc.
          K=$(ls -d build_dir/target-*/linux-*/linux-5.4.* | head -1)
          # The kernel package's vermagic hash is md5 over the =y/=m lines of
          # .config.set (before oldconfig); kept to find why it differs.
          cp "$K/.config.set" /work/out/kernel-config.set || true
          cp "$K/.vermagic" /work/out/kernel-vermagic.txt || true
          # OpenWrt's package/ folder after GL.iNet's patches (they patch e.g.
          # dnsmasq, netifd, base-files): lets SDK builds of base packages match.
          tar -czf /work/out/sdk/openwrt-package-dir.tar.gz --exclude=.git package
          tar -C "$K" -czf /work/out/sdk/mtk-eth-driver-src.tar.gz \
            --exclude='*.o' --exclude='*.ko' --exclude='*.cmd' --exclude='*.mod*' \
            drivers/net/ethernet/mediatek
          cp -a bin/targets/mediatek/mt7981 /work/out/images
          ccache -s 2>/dev/null || true
          EOF
          chmod +x work/build.sh

      - name: Build in Ubuntu 20.04
        env:
          USE_CCACHE: ${{ inputs.ccache }}
          PUBLISH_SDK: ${{ inputs.publish_sdk }}
          CLOSED: ${{ inputs.closed }}
        run: |
          # Full output to build.log; package-level progress and errors to the
          # live log (and progress.log). The time limit leaves room for the
          # steps that save cache, report and logs.
          set -o pipefail
          # KEEP_TREE (local runs only): an empty host folder for the OpenWrt
          # tree, kept after the run for quick single-package rebuilds
          timeout 320m docker run --rm -v "$PWD/work:/work" \
            ${KEEP_TREE:+-v "$KEEP_TREE:/home/glinet/work"} \
            -e DRY_RUN -e FORK -e MTK_FEED_OLD -e MTK_FEED_MIRROR -e USE_CCACHE -e PUBLISH_SDK -e CLOSED \
            ubuntu:20.04 bash /work/build.sh 2>&1 | tee work/out/build.log \
            | { grep --line-buffered -E "^ make\[[0-9]+\] |ERROR: |ccache wrapper|^\+ make |Collected errors" || true; } \
            | tee work/out/progress.log

      - name: Save cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: work/cache
          key: gl-recreate-${{ inputs.release }}-${{ github.run_id }}

      - name: Compare with the official release
        if: always()
        run: |
          cd work/cmp
          ours=$(ls ../out/images/*glinet_gl-mt2500*sysupgrade*.bin 2>/dev/null | head -1 || true)
          S="$GITHUB_WORKSPACE/.github/scripts"
          python3 "$S/fit-ikconfig.py" official/*/kernel kconfig-official.txt || true
          if [ -n "$ours" ]; then
            mkdir ours && tar -xf "$ours" -C ours
            sudo unsquashfs -q -d our_root ours/*/root > /dev/null
            python3 "$S/fit-ikconfig.py" ours/*/kernel kconfig-ours.txt || true
          fi
          sudo python3 "$S/compare-firmware.py" off_root our_root \
            ../out/removed-packages.txt ../out/report kconfig-official.txt kconfig-ours.txt
          # the report folder belongs to root now; the appends below run as us
          sudo chown -R "$(id -u)" ../out
          if [ -d our_root ]; then
            sudo python3 "$S/classify-diffs.py" off_root our_root ../out/report/files-different.txt \
              ../out/report/files-different-classes.tsv >> ../out/report/report.md || true
            sudo python3 "$S/control-diffs.py" off_root our_root ../out/report/control-diffs.tsv >> ../out/report/control-kinds.txt || true
          fi
          sudo chown -R "$(id -u)" ../out
          cat ../out/report/report.md >> "$GITHUB_STEP_SUMMARY"

      # The SDK (GL.iNet's 21.02 toolchain plus the prepared kernel tree)
      # lets other workflows build kernel modules exactly like GL.iNet did.
      # It contains only open-source code: OpenWrt, the kernel and
      # GL.iNet's public patches.
      - name: Publish the SDK
        if: success() && inputs.publish_sdk && !inputs.closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l work/out/sdk/
          tag=gl-${{ inputs.release }}-sdk
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" \
            --title "GL.iNet ${{ inputs.release }} recreation: OpenWrt SDK" --prerelease \
            --notes "OpenWrt SDK from the GL.iNet ${{ inputs.release }} recreation (OpenWrt 21.02 at bcaabe6d plus GL.iNet's public patches; CONFIG_ALL_KMODS). For building kernel modules like GL.iNet's. Updated by every successful run."
          gh release upload "$tag" work/out/sdk/* --clobber

      # A complete image contains GL.iNet's closed files: never published.
      - name: Remove the complete image (closed run)
        if: always() && inputs.closed
        run: rm -rf work/out/images work/out/sdk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gl-${{ inputs.release }}-recreation
          path: |
            work/out/report/
            work/out/images/
            work/out/config.txt
            work/out/kernel-config.set
            work/out/kernel-vermagic.txt
            work/out/mirror.txt
            work/out/opkg-install-list.txt
            work/out/removed-packages.txt
            work/out/build.log
            work/out/progress.log
            work/out/failed.txt
            work/out/build-logs.tar.gz
